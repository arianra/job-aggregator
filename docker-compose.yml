version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: job-aggregator-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-job_aggregator}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-job_aggregator}']
      interval: 10s
      timeout: 5s
      retries: 5

  # LibreOffice headless (E3.4) — reference renderer for DOCX→PDF.
  # SIMPLEST documented choice: install LibreOffice on the host (WSL: `sudo apt
  # install libreoffice-writer libreoffice-core`) and set SOFFICE_BIN=soffice.
  # The backend wrapper (backend/src/services/pdf-deriver.ts) shells out to it.
  # A containerized LibreOffice is supported via SOFFICE_BIN pointing at any
  # headless soffice binary (host or container) — see that file.

volumes:
  postgres_data:
    driver: local
