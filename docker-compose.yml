version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: job-aggregator-db
    environment:
      POSTGRES_USER: job_aggregator
      POSTGRES_DB: job_aggregator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_aggregator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
